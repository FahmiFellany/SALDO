<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Auto-refresh halaman setiap 5 menit (300 detik) -->
    <meta http-equiv="refresh" content="300">
    <!-- Mencegah Browser Caching agar saat di-refresh selalu mengambil saldo paling baru dari server -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Monitoring Saldo Rajabiller</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
        }
        .card { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 440px; 
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        h2 { 
            color: #333333; 
            font-size: 20px; 
            margin: 0;
        }
        .sync-badge {
            font-size: 11px;
            background: #e7f1ff;
            color: #0d6efd;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }
        ul { 
            list-style: none; 
            padding: 0; 
            margin: 15px 0 0 0; 
        }
        li { 
            padding: 12px 0; 
            border-bottom: 1px dashed #eeeeee; 
            font-size: 15px; 
            color: #555555; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        li:last-child { border-bottom: none; }
        span.saldo-val { 
            font-weight: 700; 
            color: #0d6efd; 
            font-family: monospace, sans-serif;
            font-size: 16px;
        }
        .last-update {
            margin-top: 20px;
            font-size: 12px;
            color: #888888;
            text-align: center;
            border-top: 1px solid #f0f0f0;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <!-- KONTEN MENU UTAMA APLIKASI -->
    <div class="card">
        <div class="card-header">
            <h2>Update Info Saldo PDAM</h2>
            <span class="sync-badge">🟢 Live Auto-Sync</span>
        </div>
        <ul>
            <li>Pagi (06:00 - 08:00 WIB): <span id="saldo-pagi" class="saldo-val">Rp 0,00</span></li>
            <li>Siang (12:00 - 14:00 WIB): <span id="saldo-siang" class="saldo-val">Rp 0,00</span></li>
            <li>Sore (15:00 - 17:00 WIB): <span id="saldo-sore" class="saldo-val">Rp 0,00</span></li>
            <li>Malam (17:00 - 20:59 WIB): <span id="saldo-malam" class="saldo-val">Rp 277.652.777,00</span></li>
        </ul>
        <div class="last-update" id="sync-status">
            Terakhir di-refresh: <strong id="time-display">Baru saja</strong>
        </div>
    </div>

    <!-- SCRIPT AUTO FETCH TANPA CACHE SAAT HALAMAN DI-REFRESH -->
    <script>
        async function fetchLatestSaldo() {
            try {
                // Fetch index.html versi terbaru dari GitHub Raw dengan parameter timestamp bebas-cache
                const response = await fetch('https://raw.githubusercontent.com/FahmiFellany/SALDO/main/index.html?t=' + Date.now(), {
                    cache: 'no-store'
                });
                if (response.ok) {
                    const text = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');

                    ['saldo-pagi', 'saldo-siang', 'saldo-sore', 'saldo-malam'].forEach(id => {
                        const newElem = doc.getElementById(id);
                        const currentElem = document.getElementById(id);
                        if (newElem && currentElem) {
                            currentElem.innerText = newElem.innerText;
                        }
                    });
                }
            } catch (err) {
                console.log('Sync error:', err);
            }
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB';
            document.getElementById('time-display').innerText = timeStr;
        }

        // Jalankan otomatis saat halaman dimuat/di-refresh
        window.addEventListener('DOMContentLoaded', fetchLatestSaldo);
    </script>

</body>
</html>
