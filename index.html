<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Saldo Rajabiller</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; text-align: center; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        ul { list-style: none; padding: 0; text-align: left; }
        li { margin: 10px 0; font-size: 18px; }
        span { font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Update Info Saldo PDAM</h2>
        <ul>
            <li>Pagi: <span id="saldo-pagi">Rp 0,00</span></li>
            <li>Siang: <span id="saldo-siang">Rp 0,00</span></li>
            <li>Sore: <span id="saldo-sore">Rp 0,00</span></li>
            <li>Malam: <span id="saldo-malam">Rp 0,00</span></li>
        </ul>
    </div>
</body>
</html>
