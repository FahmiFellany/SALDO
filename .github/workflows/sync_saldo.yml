name: Auto Sync Saldo Rajabiller

on:
  schedule:
    # Otomatisasi sync saldo setiap 5 menit sekali
    - cron: '*/5 * * * *'
  workflow_dispatch: # Fitur tombol pemicu manual lewat dashboard GitHub

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies & Headless Browser
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium --with-deps

    - name: Execute Scraper Engine
      env:
        # Menghubungkan variabel skrip ke sistem penyimpanan rahasia GitHub Secrets
        RAJABILLER_USER: ${{ secrets.RAJABILLER_USER }}
        RAJABILLER_PASSWORD: ${{ secrets.RAJABILLER_PASSWORD }}
      run: python update_saldo.py

    - name: Verify and Commit Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        
        # Melakukan commit hanya jika ada perubahan angka saldo di file index.html
        if ! git diff --cached --exit-code; then
          git commit -m "🤖 Update otomatis informasi saldo log berkala [System Sync]"
          git push
        else
          echo "Tidak ada perubahan nilai saldo baru pada sesi ini. Lewati langkah commit."
        fi
